<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOXO.COM</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 10%,#432a8c,transparent 35%),linear-gradient(135deg,#07111f,#121b30)}
.card{width:min(430px,92vw);padding:30px;background:#111b2eee;border:1px solid #2b3a59;border-radius:24px;box-shadow:0 25px 80px #0009}.logo{font-size:44px;font-weight:900}.sub{color:#aab5ca;margin:8px 0 24px}input{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #293957;background:#091222;color:white;outline:none}button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:12px;background:linear-gradient(135deg,#765cff,#438dff);color:white;font-weight:800;cursor:pointer}.msg{min-height:20px;margin-top:12px;color:#ffadb9;font-size:13px}.info{margin-top:14px;color:#96a4bd;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">VOXO.COM</div>
  <div class="sub">Area privata</div>
  <input id="u" placeholder="Numero / utente" autocomplete="username">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="login()">ACCEDI</button>
  <div id="m" class="msg"></div>
  <div class="info">Gli account vengono creati dall'Admin. Questa pagina è la vetrina pubblica di VOXO; la chat multiutente reale richiede il server online.</div>
</div>
<script>
function login(){
  document.getElementById("m").textContent =
    "La pubblicazione pubblica è attiva. La funzione di accesso reale verrà collegata al server nella fase successiva.";
}
</script>
</body>
</html>
