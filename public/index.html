<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOXO.COM</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#f5f7ff;min-height:100vh;background:radial-gradient(circle at 15% 0,#352174,transparent 35%),#08111f}
button,input{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#111b2eee;border:1px solid #2a3852;border-radius:22px;padding:28px;box-shadow:0 25px 80px #0008}.logo{font-size:42px;font-weight:900}.muted{color:#9eabc5;font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#9eabc5;margin-bottom:6px}input{width:100%;padding:12px;border-radius:12px;border:1px solid #2a3852;background:#091321;color:#fff;outline:none}.primary,.secondary,.danger{padding:11px 14px;border-radius:12px;font-weight:700;border:1px solid #2a3852}.primary{background:linear-gradient(135deg,#765cff,#428bff);color:#fff;border:0}.secondary{background:#ffffff0a;color:#fff}.danger{background:#ff607814;color:#ff9baa}.msgbox{margin-top:12px;padding:10px;border-radius:10px;background:#ffffff08;color:#cbd5e7}
.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#050b15e8;border-right:1px solid #22304a;padding:18px}.side .logo{font-size:25px;margin-bottom:18px}.me{padding:12px;border:1px solid #22304a;border-radius:15px;background:#ffffff07;margin-bottom:16px}.nav{display:grid;gap:8px}.nav button{text-align:left;width:100%}.main{padding:20px}.title{font-size:28px;font-weight:900;margin-bottom:16px}.panel{background:#101a2bdd;border:1px solid #263553;border-radius:20px}.chat{height:calc(100vh - 95px);display:flex;flex-direction:column;overflow:hidden}.head,.composer{padding:14px;border-bottom:1px solid #263553}.composer{border-top:1px solid #263553;border-bottom:0;display:flex;gap:8px}.composer input{flex:1}.msgs{flex:1;overflow:auto;padding:18px}.msg{margin:10px 0}.mine{text-align:right}.bubble{display:inline-block;max-width:75%;text-align:left;padding:10px 13px;border-radius:16px;background:#ffffff0a;border:1px solid #263553}.mine .bubble{background:linear-gradient(135deg,#765cff,#428bff);border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.section{padding:18px}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #263553;gap:10px}.actions{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:720px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #22304a}.nav{grid-template-columns:1fr 1fr}.main{padding:12px}.chat{height:calc(100vh - 245px)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
var state={token:localStorage.getItem("voxo_token"),user:null,view:"chat",socket:null};
function esc(value){return String(value==null?"":value).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function api(url,options){options=options||{};var headers=Object.assign({"Content-Type":"application/json"},options.headers||{});if(state.token)headers.Authorization="Bearer "+state.token;return fetch(url,Object.assign({},options,{headers:headers})).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error||"Errore");return d})})}
function loginPage(error){document.getElementById("root").innerHTML='<div class="login"><div class="card"><div class="logo">VOXO.COM</div><p class="muted">Area privata • accesso riservato</p><div class="field"><label>Numero / utente</label><input id="phone" placeholder="Es. 3331234567"></div><div class="field"><label>Password</label><input id="pass" type="password" placeholder="Password"></div><button class="primary" id="go" style="width:100%">Accedi</button><div class="msgbox">'+esc(error||"")+'</div><div class="msgbox">Demo Admin: admin / admin123<br>Demo utenti: 3330000001 - 3330000005 / voxo123</div></div></div>';document.getElementById("go").onclick=login;document.getElementById("pass").onkeydown=function(e){if(e.key==="Enter")login()}}
function login(){api("/api/login",{method:"POST",body:JSON.stringify({phone:document.getElementById("phone").value,password:document.getElementById("pass").value})}).then(function(d){state.token=d.token;state.user=d.user;localStorage.setItem("voxo_token",state.token);render()}).catch(function(e){loginPage(e.message)})}
function render(){document.getElementById("root").innerHTML='<div class="app"><aside class="side"><div class="logo">VOXO.COM</div><div class="me"><b>'+esc(state.user.name)+'</b><div class="muted">'+(state.user.role==="admin"?"Amministratore":"Utente")+'</div></div><div class="nav"><button class="secondary" onclick="showView(\'chat\')">💬 Chat</button><button class="secondary" onclick="showView(\'voice\')">🎙️ Voce</button><button class="secondary" onclick="showView(\'profile\')">👤 Profilo</button>'+(state.user.role==="admin"?'<button class="secondary" onclick="showView(\'admin\')">👑 Admin</button>':"")+'<button class="danger" onclick="logout()">Esci</button></div></aside><main class="main"><div id="page"></div></main></div>';showView(state.view)}
function logout(){localStorage.removeItem("voxo_token");state.token=null;state.user=null;if(state.socket)state.socket.disconnect();loginPage()}
window.showView=function(view){state.view=view;var page=document.getElementById("page");if(view==="chat")return drawChat(page);if(view==="voice")return drawVoice(page);if(view==="profile")return drawProfile(page);if(view==="admin")return drawAdmin(page)}
function setupSocket(onMessage){if(!state.socket){state.socket=io();state.socket.emit("register",state.token)}state.socket.off("new-message");state.socket.on("new-message",function(){if(onMessage)onMessage()})}
function drawChat(page){page.innerHTML='<div class="title">Chat 💬</div><div class="panel chat"><div class="head"><b>Piazza VOXO</b> <span class="muted">Filtro parole attivo</span></div><div id="msgs" class="msgs"></div><div class="composer"><input id="text" placeholder="Scrivi un messaggio..."><button class="primary" id="send">Invia</button></div></div>';function load(){api("/api/messages").then(function(ms){document.getElementById("msgs").innerHTML=ms.map(function(m){return '<div class="msg '+(m.userId===state.user.id?"mine":"")+'"><div class="bubble"><div class="muted">'+esc(m.userName)+'</div>'+esc(m.text)+'</div></div>'}).join("")||'<div class="muted">Nessun messaggio.</div>';var box=document.getElementById("msgs");box.scrollTop=box.scrollHeight})}function send(){var input=document.getElementById("text");if(!input.value.trim())return;api("/api/messages",{method:"POST",body:JSON.stringify({text:input.value})}).then(function(){input.value="";load()}).catch(function(e){alert(e.message)})}document.getElementById("send").onclick=send;document.getElementById("text").onkeydown=function(e){if(e.key==="Enter")send()};load();setupSocket(load)}
function drawProfile(page){page.innerHTML='<div class="title">Profilo 👤</div><div class="panel section"><h3>'+esc(state.user.name)+'</h3><p class="muted">Accesso: '+esc(state.user.phone)+'</p><div class="field"><label>Nuova password</label><input id="newpass" type="password" placeholder="almeno 6 caratteri"></div><button class="primary" id="savepass">Salva password</button><div id="pmsg" class="msgbox"></div></div>';document.getElementById("savepass").onclick=function(){var p=document.getElementById("newpass").value;if(p.length<6){document.getElementById("pmsg").textContent="Password troppo corta.";return}api("/api/users/"+state.user.id,{method:"PATCH",body:JSON.stringify({password:p})}).then(function(){document.getElementById("pmsg").textContent="✅ Password aggiornata."}).catch(function(e){document.getElementById("pmsg").textContent="❌ "+e.message})}}
function drawAdmin(page){api("/api/users").then(function(users){page.innerHTML='<div class="title">Pannello Admin 👑</div><div class="grid"><div class="panel section"><h3>➕ Aggiungi utente</h3><div class="field"><label>Nome</label><input id="un"></div><div class="field"><label>Numero</label><input id="up"></div><div class="field"><label>Password</label><input id="uw" type="password"></div><button class="primary" id="add">Crea utente</button><div id="am" class="msgbox"></div></div><div class="panel section"><h3>👥 Utenti</h3><div id="ul"></div></div></div>';function draw(){document.getElementById("ul").innerHTML=users.map(function(u){return '<div class="row"><div><b>'+esc(u.name)+'</b><div class="muted">'+esc(u.phone)+' • '+(u.active?"Attivo":"Bloccato")+'</div></div>'+(u.role!=="admin"?'<div class="actions"><button class="secondary" data-toggle="'+u.id+'">'+(u.active?"Blocca":"Sblocca")+'</button><button class="danger" data-delete="'+u.id+'">Elimina</button></div>':"")+'</div>'}).join("")}document.getElementById("add").onclick=function(){api("/api/users",{method:"POST",body:JSON.stringify({name:document.getElementById("un").value,phone:document.getElementById("up").value,password:document.getElementById("uw").value})}).then(function(u){document.getElementById("am").textContent="✅ Creato: "+u.name;users.push(u);draw()}).catch(function(e){document.getElementById("am").textContent="❌ "+e.message})};document.getElementById("ul").onclick=function(e){var toggle=e.target.getAttribute("data-toggle"),del=e.target.getAttribute("data-delete");if(toggle){var user=users.find(function(x){return x.id===toggle});api("/api/users/"+toggle,{method:"PATCH",body:JSON.stringify({active:!user.active})}).then(function(updated){user.active=updated.active;draw()})}if(del){if(!confirm("Eliminare questo utente?"))return;api("/api/users/"+del,{method:"DELETE"}).then(function(){users=users.filter(function(x){return x.id!==del});draw()})}};draw()})}
function drawVoice(page){page.innerHTML='<div class="title">Chat vocale 🎙️</div><div class="panel section"><h3>Stanza vocale</h3><p class="muted">Il server VOXO supporta il segnalamento WebRTC. Per una stanza vocale completa aggiungeremo la gestione dei partecipanti nel prossimo aggiornamento.</p><button class="primary" id="mic">Attiva microfono</button><button class="secondary" id="stop" style="margin-left:8px">Disattiva</button><div id="vmsg" class="msgbox">Microfono non attivo</div></div>';var stream=null;document.getElementById("mic").onclick=function(){navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){stream=s;document.getElementById("vmsg").textContent="✅ Microfono autorizzato."}).catch(function(){document.getElementById("vmsg").textContent="❌ Microfono non disponibile."})};document.getElementById("stop").onclick=function(){if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;document.getElementById("vmsg").textContent="Microfono non attivo"}}
(function(){if(!state.token)return loginPage();api("/api/me").then(function(d){state.user=d.user;render()}).catch(function(){localStorage.removeItem("voxo_token");state.token=null;loginPage()})})();
</script>
</body>
</html>
